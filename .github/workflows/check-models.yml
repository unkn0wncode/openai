name: Check for outdated or unimplemented models

on:
    schedule:
        - cron: '0 0 * * *'
    push:
    workflow_dispatch:

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check-models
        env:
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is required for the model catalog check" >&2
            exit 1
          fi
          go test ./models -run '^TestModelsList$' -count=1 -timeout 50s
